services:
  - type: web
    name: ncspectra-backend
    env: python
    region: oregon
    plan: free
    rootDir: FastAPI
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9